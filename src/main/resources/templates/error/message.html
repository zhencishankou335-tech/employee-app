<!DOCTYPE html>
<html lang="ja" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title th:text="${errorTitle} + ' | 社員名簿'">エラー | 社員名簿</title>
  <link rel="stylesheet" th:href="@{/css/app.css}">
</head>
<body>

<!-- ヘッダ帯（ログイン中の利用者名・ログアウトを含む）は fragments/layout.html に共通化 -->
<header th:replace="~{fragments/layout :: appHeader}"></header>

<main class="app-main">

  <div class="page-head">
    <h1 class="page-title" th:text="${errorTitle}">データが見つかりません</h1>
  </div>

  <div class="error-summary">
    <p th:text="${errorDetail}">対象のデータがありません</p>
  </div>

  <!-- 補足の一文は呼び出し側が渡す。404と403で書くべき内容が違うため -->
  <p th:if="${errorHint}" th:text="${errorHint}">補足</p>

  <div class="form-actions">
    <a class="btn btn-primary" th:href="@{/employees}">社員一覧に戻る</a>
  </div>

</main>

</body>
</html>
