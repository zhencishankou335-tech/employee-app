<!DOCTYPE html>
<html lang="ja" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title th:text="${editing} ? '社員情報の編集 | 社員名簿' : '社員の新規登録 | 社員名簿'">社員の新規登録</title>
  <link rel="stylesheet" th:href="@{/css/app.css}">
</head>
<body>

<header class="app-header">
  <span class="app-title">社員名簿</span>
  <nav class="app-nav">
    <a th:href="@{/employees}">社員一覧</a>
    <a th:href="@{/employees/summary}">部署別人数</a>
  </nav>
</header>

<main class="app-main">

  <div class="page-head">
    <h1 class="page-title" th:text="${editing} ? '社員情報の編集' : '社員の新規登録'">社員の新規登録</h1>
  </div>

  <!-- 入力エラーがあるときの見出し。項目ごとのメッセージは各欄の下に出る -->
  <div class="error-summary" th:if="${#fields.hasErrors('employeeForm.*')}">
    <p>入力内容に誤りがあります。赤字の項目を確認してください。</p>
  </div>

  <!--
    th:action は、新規なら POST /employees、編集なら POST /employees/{id} に切り替わる。
    th:object を指定すると、以下の項目で *{name} のように短く書ける。
  -->
  <form class="entry-form" method="post"
        th:action="${editing} ? @{/employees/{id}(id=${employeeId})} : @{/employees}"
        th:object="${employeeForm}">

    <div class="field">
      <label for="employeeNumber">社員番号 <span class="required">必須</span></label>
      <input type="text" id="employeeNumber" th:field="*{employeeNumber}"
             placeholder="E0001" maxlength="10">
      <p class="hint">英大文字1字 + 数字4桁</p>
      <p class="error" th:if="${#fields.hasErrors('employeeNumber')}"
         th:errors="*{employeeNumber}"></p>
    </div>

    <div class="field">
      <label for="name">氏名 <span class="required">必須</span></label>
      <input type="text" id="name" th:field="*{name}" placeholder="山田 太郎" maxlength="50">
      <p class="error" th:if="${#fields.hasErrors('name')}" th:errors="*{name}"></p>
    </div>

    <div class="field">
      <label for="nameKana">フリガナ <span class="required">必須</span></label>
      <input type="text" id="nameKana" th:field="*{nameKana}" placeholder="ヤマダ タロウ" maxlength="50">
      <p class="hint">全角カタカナ</p>
      <p class="error" th:if="${#fields.hasErrors('nameKana')}" th:errors="*{nameKana}"></p>
    </div>

    <div class="field">
      <label for="departmentInput">部署 <span class="required">必須</span></label>
      <select id="departmentInput" th:field="*{department}">
        <option value="">選択してください</option>
        <option th:each="d : ${departments}" th:value="${d}" th:text="${d.label}"></option>
      </select>
      <p class="error" th:if="${#fields.hasErrors('department')}" th:errors="*{department}"></p>
    </div>

    <div class="field">
      <label for="email">メールアドレス</label>
      <input type="text" id="email" th:field="*{email}" placeholder="yamada@example.com" maxlength="100">
      <p class="error" th:if="${#fields.hasErrors('email')}" th:errors="*{email}"></p>
    </div>

    <div class="field">
      <label for="hireDate">入社日 <span class="required">必須</span></label>
      <input type="date" id="hireDate" th:field="*{hireDate}">
      <p class="error" th:if="${#fields.hasErrors('hireDate')}" th:errors="*{hireDate}"></p>
    </div>

    <div class="field">
      <label for="statusInput">在籍区分 <span class="required">必須</span></label>
      <select id="statusInput" th:field="*{status}">
        <option value="">選択してください</option>
        <option th:each="s : ${statuses}" th:value="${s}" th:text="${s.label}"></option>
      </select>
      <p class="error" th:if="${#fields.hasErrors('status')}" th:errors="*{status}"></p>
    </div>

    <div class="field">
      <label for="note">備考</label>
      <textarea id="note" th:field="*{note}" rows="3" maxlength="200"></textarea>
      <p class="error" th:if="${#fields.hasErrors('note')}" th:errors="*{note}"></p>
    </div>

    <div class="form-actions">
      <button type="submit" class="btn btn-primary"
              th:text="${editing} ? '更新する' : '登録する'">登録する</button>
      <a class="btn" th:href="@{/employees}">キャンセル</a>
    </div>

  </form>

</main>

</body>
</html>
