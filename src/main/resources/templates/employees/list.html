<!DOCTYPE html>
<html lang="ja" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>社員一覧 | 社員名簿</title>
  <link rel="stylesheet" th:href="@{/css/app.css}">
</head>
<body>

<header class="app-header">
  <span class="app-title">社員名簿</span>
  <nav class="app-nav">
    <a th:href="@{/employees}">社員一覧</a>
    <a th:href="@{/employees/summary}">部署別人数</a>
  </nav>
</header>

<main class="app-main">

  <div class="page-head">
    <h1 class="page-title">社員一覧</h1>
    <a class="btn btn-primary" th:href="@{/employees/new}">新規登録</a>
  </div>

  <!-- 登録・更新・削除のあとに1回だけ出るメッセージ -->
  <p class="flash" th:if="${message}" th:text="${message}"></p>

  <!-- 検索条件 -->
  <form class="search-panel" method="get" th:action="@{/employees}">
    <div class="field">
      <label for="keyword">氏名・フリガナ・社員番号</label>
      <input type="text" id="keyword" name="keyword" th:value="${keyword}"
             placeholder="部分一致で検索">
    </div>

    <div class="field">
      <label for="department">部署</label>
      <select id="department" name="department">
        <option value="">すべて</option>
        <option th:each="d : ${departments}"
                th:value="${d}"
                th:text="${d.label}"
                th:selected="${department != null and department.name() == d.name()}"></option>
      </select>
    </div>

    <div class="field">
      <label for="status">在籍区分</label>
      <select id="status" name="status">
        <option value="">すべて</option>
        <option th:each="s : ${statuses}"
                th:value="${s}"
                th:text="${s.label}"
                th:selected="${status != null and status.name() == s.name()}"></option>
      </select>
    </div>

    <div class="search-actions">
      <button type="submit" class="btn btn-primary">検索</button>
      <a class="btn" th:href="@{/employees}">条件クリア</a>
      <a class="btn"
         th:href="@{/employees/csv(keyword=${keyword},department=${department},status=${status})}">CSV出力</a>
    </div>
  </form>

  <!-- 件数表示。業務系の一覧では必ず求められる -->
  <p class="result-count">
    <span th:text="${page.totalElements}">0</span> 件中
    <span th:text="${page.totalElements == 0} ? 0 : ${page.number * page.size + 1}">0</span> -
    <span th:text="${page.number * page.size + page.numberOfElements}">0</span> 件を表示
  </p>

  <table class="data-table">
    <thead>
    <tr>
      <th scope="col">社員番号</th>
      <th scope="col">氏名</th>
      <th scope="col">フリガナ</th>
      <th scope="col">部署</th>
      <th scope="col">メールアドレス</th>
      <th scope="col">入社日</th>
      <th scope="col">在籍区分</th>
      <th scope="col">操作</th>
    </tr>
    </thead>
    <tbody>
    <tr th:if="${page.isEmpty()}">
      <td colspan="8" class="empty">該当する社員がいません</td>
    </tr>
    <tr th:each="e : ${page.content}">
      <td th:text="${e.employeeNumber}">E0001</td>
      <td th:text="${e.name}">山田 太郎</td>
      <td th:text="${e.nameKana}">ヤマダ タロウ</td>
      <td th:text="${e.department.label}">営業部</td>
      <td th:text="${e.email}">yamada@example.com</td>
      <td th:text="${#temporals.format(e.hireDate, 'yyyy/MM/dd')}">2018/04/01</td>
      <td>
        <span class="status-badge"
              th:classappend="'status-' + ${e.status.name().toLowerCase()}"
              th:text="${e.status.label}">在籍</span>
      </td>
      <td class="row-actions">
        <a class="btn btn-small" th:href="@{/employees/{id}/edit(id=${e.id})}">編集</a>

        <form method="post" th:action="@{/employees/{id}/retire(id=${e.id})}"
              th:if="${e.status.name() != 'RETIRED'}"
              onsubmit="return confirm('この社員を退職にします。よろしいですか？');">
          <button type="submit" class="btn btn-small">退職</button>
        </form>

        <form method="post" th:action="@{/employees/{id}/delete(id=${e.id})}"
              onsubmit="return confirm('この社員のデータを完全に削除します。元に戻せません。よろしいですか？');">
          <button type="submit" class="btn btn-small btn-danger">削除</button>
        </form>
      </td>
    </tr>
    </tbody>
  </table>

  <!-- ページ送り -->
  <nav class="pagination" th:if="${page.totalPages > 1}">
    <a th:if="${!page.first}"
       th:href="@{/employees(page=${page.number - 1},keyword=${keyword},department=${department},status=${status})}">前へ</a>
    <span th:text="${page.number + 1} + ' / ' + ${page.totalPages}">1 / 2</span>
    <a th:if="${!page.last}"
       th:href="@{/employees(page=${page.number + 1},keyword=${keyword},department=${department},status=${status})}">次へ</a>
  </nav>

</main>

</body>
</html>
