# ===============================================================
# 全プロファイル共通の設定
# ===============================================================
# 環境によって変わる設定（DBの接続先・ログの量・デバッグ画面の有無）は
# ここに書かず、application-dev.properties / application-prod.properties に分ける。
#
#   開発（既定）: mvnw spring-boot:run                          → dev
#   本番        : java -jar app.jar --spring.profiles.active=prod → prod
#
# 共通ファイルに開発用の値を書いてしまうと、本番で消し忘れて事故になる。
# 「共通に書くのは、どの環境でも同じでなければ困るものだけ」にする。
# ---------------------------------------------------------------

spring.application.name=employee-app

# プロファイルを指定せずに起動したときは dev として扱う。
# spring.profiles.active ではなく default にしておくと、
# 起動時に --spring.profiles.active=prod で上書きできる。
spring.profiles.default=dev

# ---------------------------------------------------------------
# DBマイグレーション（Flyway）
# ---------------------------------------------------------------
# テーブル定義は db/migration の SQL ファイルで管理する。
# 読み込むフォルダはプロファイルごとに変える（dev だけ確認用データを追加で読む）。
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration

# ---------------------------------------------------------------
# JPA / Hibernate
# ---------------------------------------------------------------
# validate = テーブルを作りも変えもしない。エンティティの定義と実際のテーブルが
# 食い違っていたら起動時にエラーで止める。
# 以前の update は「勝手にテーブルを変える」設定で、本番では絶対に使わない。
spring.jpa.hibernate.ddl-auto=validate

# 画面描画中にDB接続を開きっぱなしにしない
spring.jpa.open-in-view=false

server.port=8080
