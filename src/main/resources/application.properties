spring.application.name=employee-app

# ---------------------------------------------------------------
# データベース（H2）
# ---------------------------------------------------------------
# jdbc:h2:file: にするとファイルに保存されるので、アプリを止めてもデータが残る。
# jdbc:h2:mem: にするとメモリ上だけになり、止めた瞬間に消える。
spring.datasource.url=jdbc:h2:file:./data/employeedb
spring.datasource.username=sa
spring.datasource.password=

# ブラウザからDBの中身を直接見られる画面。http://localhost:8080/h2-console
# 練習用。本番では必ず無効にする。
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# ---------------------------------------------------------------
# JPA / Hibernate
# ---------------------------------------------------------------
# update = エンティティの定義に合わせてテーブルを自動で作る・追従する。
# 現場では Flyway などで管理するので、これは学習用の設定。
spring.jpa.hibernate.ddl-auto=update

# 実行されたSQLをコンソールに出す。何が起きているか見えるようにしておく。
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# 画面描画中にDB接続を開きっぱなしにしない（推奨設定）
spring.jpa.open-in-view=false

# ---------------------------------------------------------------
# 画面
# ---------------------------------------------------------------
# テンプレートをキャッシュしない。HTMLを直すとブラウザ再読み込みだけで反映される。
spring.thymeleaf.cache=false

server.port=8080
