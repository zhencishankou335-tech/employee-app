# ===============================================================
# 本番（prod）プロファイル
# ===============================================================
#   java -jar employee-app.jar --spring.profiles.active=prod
#
# 【方針】
# 1. 接続情報とパスワードをこのファイルに書かない。環境変数から受け取る。
#    ${DB_URL} のように既定値を書かないと、環境変数が無い場合は起動時にエラーで止まる。
#    「うっかり開発用のDBに本番でつないでいた」を防ぐには、
#    既定値を用意しないほうが安全（起動しないほうがマシ）。
# 2. 開発用の便利機能（SQLの表示・H2コンソール・エラー詳細）はすべて切る。
#    攻撃者に内部構造を教えることになるため。
# 3. 確認用データ（db/dev）を読まない。
# ---------------------------------------------------------------

# ---------------------------------------------------------------
# データベース
# ---------------------------------------------------------------
# 環境変数 DB_URL / DB_USERNAME / DB_PASSWORD で指定する。
# PostgreSQL などに変える場合は、pom.xml にJDBCドライバを追加し、
# db/migration のSQLをそのDBの文法に合わせる必要がある（今回は未実施）。
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}

# ---------------------------------------------------------------
# マイグレーション
# ---------------------------------------------------------------
# テーブル定義だけを適用する。確認用データ（db/dev）は読まない。
spring.flyway.locations=classpath:db/migration

# 適用済みのファイルが書き換えられていたら起動を止める（既定値だが、意図を明示するため書く）
spring.flyway.validate-on-migrate=true

# 番号の飛んだマイグレーションを黙って適用しない
spring.flyway.out-of-order=false

# ---------------------------------------------------------------
# 初期管理者アカウント
# ---------------------------------------------------------------
# app_user が空のときだけ、この情報で管理者を1人作る（AdminBootstrap）。
# 環境変数が無ければ起動時にエラーで止める。
app.admin.username=${ADMIN_USERNAME}
app.admin.password=${ADMIN_PASSWORD}
# 既定値を空にしている理由：
# .properties ファイルは ISO-8859-1 として読まれるため、値に日本語を書くと文字化けする。
# 実測：既定値に「システム管理者」と書いたところ、DBには U+00E3 U+0082 U+00B7 …
# （UTF-8のバイト列が1文字ずつバラバラになった状態）で保存された。
# 日本語の既定値は Java 側（AdminBootstrap）に持たせる。
app.admin.display-name=${ADMIN_DISPLAY_NAME:}

# ---------------------------------------------------------------
# 開発用機能を切る
# ---------------------------------------------------------------
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false
spring.h2.console.enabled=false

# テンプレートをキャッシュする（毎回ファイルを読みに行かない）
spring.thymeleaf.cache=true

# ---------------------------------------------------------------
# エラー画面から内部情報を出さない
# ---------------------------------------------------------------
# 例外メッセージやスタックトレースが利用者に見えると、
# テーブル名やライブラリのバージョンが分かってしまう。
server.error.include-message=never
server.error.include-stacktrace=never
server.error.include-binding-errors=never
server.error.include-exception=false

# ---------------------------------------------------------------
# セッションCookie
# ---------------------------------------------------------------
# http-only : JavaScriptから読めなくする（XSSでセッションを盗まれるのを防ぐ）
# secure    : HTTPSでしか送らない（HTTPで動かすと当然ログインが維持できない。それが正しい）
# same-site : 別サイトからのリクエストにCookieを付けない（CSRF対策の上乗せ）
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.secure=true
server.servlet.session.cookie.same-site=lax
server.servlet.session.timeout=30m

# ---------------------------------------------------------------
# ログ
# ---------------------------------------------------------------
logging.level.root=WARN
logging.level.org.springframework=WARN
logging.level.com.example.employeeapp=INFO
logging.file.name=logs/employee-app.log
