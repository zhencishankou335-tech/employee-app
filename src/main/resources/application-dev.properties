# ===============================================================
# 開発（dev）プロファイル
# ===============================================================
# 手元で動かすための設定。ここに書いたものは本番では読まれない。
# ---------------------------------------------------------------

# H2をファイルに保存する。アプリを止めてもデータが残る。
# 接続情報を直書きしてよいのは、これが手元専用の使い捨てDBだから。
spring.datasource.url=jdbc:h2:file:./data/employeedb
spring.datasource.username=sa
spring.datasource.password=

# 確認用データ（db/dev）を追加で読む。本番プロファイルはこの行を持たない。
spring.flyway.locations=classpath:db/migration,classpath:db/dev

# 確認用データの番号(V900)より小さい番号のマイグレーションを後から足せるようにする。
# 本番では既定（false）のままにして、順番の狂いを検知させる。
spring.flyway.out-of-order=true

# ブラウザからDBの中身を見る画面。http://localhost:8080/h2-console
# ログインが必要なアプリになったので、この画面だけ SecurityConfig で別扱いにしてある。
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# 実行されたSQLをコンソールに出す。何が起きているか見えるようにしておく。
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# HTMLを直したらブラウザの再読み込みだけで反映されるようにする
spring.thymeleaf.cache=false

# ログイン周りで弾かれたときに理由を追えるようにしておく
logging.level.org.springframework.security=INFO
