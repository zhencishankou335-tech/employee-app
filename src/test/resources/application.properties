# ===============================================================
# テスト実行時の設定
# ===============================================================
# src/test/resources/application.properties は
# src/main/resources/application.properties を「置き換える」（両方は読まれない）。
# そのため、テストに必要な設定はここに全部書く必要がある。
#
# プロファイルは指定しない。dev でも prod でもない状態で動かすことで、
# テストが開発用の設定（H2コンソール・確認用データ）に依存していないことを保証する。
# ---------------------------------------------------------------

# メモリ上のDB。アプリを起動したまま mvnw test を流しても、
# 開発用のDBファイル（data/employeedb）を掴まずに済む。
spring.datasource.url=jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1
spring.datasource.username=sa
spring.datasource.password=

# ---------------------------------------------------------------
# マイグレーションをテストでも実行する
# ---------------------------------------------------------------
# テスト用にテーブルを自動生成（create-drop）してしまうと、
# 「本番に適用されるSQLが正しいか」を誰も確かめないまま進むことになる。
# 実際の db/migration を流し、その上でテストを動かす。
# マイグレーションのSQLを間違えたら、テストが落ちて気づける。
#
# 確認用データ（db/dev）は読まない。各テストが必要なデータを自分で作る。
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration

# テーブルは Flyway が作る。Hibernate は定義が合っているかを確認するだけ。
spring.jpa.hibernate.ddl-auto=validate

spring.jpa.open-in-view=false
spring.thymeleaf.cache=false
